<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Recovery train with the pod, and how it packs in the airframe</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#142029"/></marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <!-- ===== Left: under canopy ===== -->
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#142029">Under the canopy</text>
  <path d="M90,108 Q230,40 370,108 L362,128 Q230,72 98,128 Z" fill="#fbe2d5" stroke="#c8410b" stroke-width="2"/>
  <text x="230" y="98" text-anchor="middle" fill="#c8410b" font-weight="bold">ram-air parafoil</text>
  <!-- risers -->
  <path d="M110,126 L224,232 M160,112 L226,232 M300,112 L234,232 M350,126 L236,232" stroke="#56636f" stroke-width="1.3" fill="none"/>
  <!-- brake lines from trailing edge corners -->
  <path d="M98,128 C 120,190 150,250 176,262" stroke="#c8410b" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M362,128 C 340,190 310,250 284,262" stroke="#c8410b" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <!-- top quick link -->
  <rect x="222" y="230" width="16" height="18" rx="6" fill="none" stroke="#142029" stroke-width="2.4"/>
  <!-- pod -->
  <rect x="170" y="252" width="120" height="120" rx="14" fill="#e9eef3" stroke="#142029" stroke-width="2"/>
  <line x1="230" y1="246" x2="230" y2="388" stroke="#8a5300" stroke-width="3"/>
  <text x="200" y="300" text-anchor="middle" font-weight="bold" fill="#142029">pod</text>
  <text x="200" y="318" text-anchor="middle" fill="#56636f" font-size="12">GPS</text>
  <text x="200" y="333" text-anchor="middle" fill="#56636f" font-size="12">faces up</text>
  <circle cx="176" cy="262" r="4" fill="#c8410b"/><circle cx="284" cy="262" r="4" fill="#c8410b"/>
  <!-- swivel and quick link -->
  <rect x="220" y="390" width="20" height="26" rx="5" fill="#ffffff" stroke="#142029" stroke-width="2.4"/>
  <line x1="220" y1="403" x2="240" y2="403" stroke="#142029" stroke-width="2"/>
  <rect x="222" y="420" width="16" height="18" rx="6" fill="none" stroke="#142029" stroke-width="2.4"/>
  <!-- shock cord and rocket -->
  <path d="M230,438 C 230,470 200,480 210,510 C 216,530 250,530 250,560" stroke="#56636f" stroke-width="2.2" fill="none"/>
  <rect x="236" y="560" width="28" height="44" rx="3" fill="#ffffff" stroke="#142029" stroke-width="2"/>
  <path d="M236,560 L250,530 L264,560" fill="#ffffff" stroke="#142029" stroke-width="2"/>
  <text x="276" y="590" fill="#142029">rocket (all sections hang here)</text>
  <!-- callouts -->
  <g fill="#142029" font-size="13">
    <line x1="238" y1="239" x2="400" y2="200" stroke="#8b97a2"/>
    <text x="404" y="196">Both riser groups → one quick link on the pod's top loop.</text>
    <text x="404" y="213" fill="#b42323">No swivel here: the pod must turn with the canopy.</text>
    <line x1="290" y1="262" x2="400" y2="262" stroke="#8b97a2"/>
    <text x="404" y="258">Steering lines: left and right brake lines</text>
    <text x="404" y="275">run to the pod's two line guides.</text>
    <line x1="233" y1="350" x2="400" y2="326" stroke="#8b97a2"/>
    <text x="404" y="320">Kevlar runs straight through the pod, top loop to bottom loop.</text>
    <text x="404" y="337">The rocket's weight never goes through plastic.</text>
    <line x1="240" y1="403" x2="400" y2="400" stroke="#8b97a2"/>
    <text x="404" y="396">Swivel below the pod, so a spinning rocket</text>
    <text x="404" y="413">can't twist the pod or the canopy.</text>
    <line x1="230" y1="470" x2="400" y2="470" stroke="#8b97a2"/>
    <text x="404" y="466">Your shock cord, attached where the main</text>
    <text x="404" y="483">parachute would normally clip on.</text>
  </g>
  <!-- ===== Right: packed ===== -->
  <text x="760" y="34" font-size="17" font-weight="bold" fill="#142029">Packed</text>
  <path d="M800,52 L840,140 L760,140 Z" fill="#ffffff" stroke="#142029" stroke-width="2"/>
  <rect x="760" y="140" width="80" height="400" fill="none" stroke="#142029" stroke-width="2"/>
  <rect x="770" y="146" width="60" height="110" rx="10" fill="#fbe2d5" stroke="#c8410b" stroke-width="1.6"/>
  <text x="800" y="196" text-anchor="middle" fill="#c8410b" font-size="12">parafoil</text>
  <text x="800" y="212" text-anchor="middle" fill="#c8410b" font-size="12">in its bag</text>
  <rect x="772" y="264" width="56" height="70" rx="8" fill="#e9eef3" stroke="#142029" stroke-width="1.6"/>
  <text x="800" y="296" text-anchor="middle" font-size="12">pod</text>
  <text x="800" y="312" text-anchor="middle" font-size="11" fill="#56636f">GPS up</text>
  <path d="M800,340 C 780,360 820,370 790,390 C 770,404 822,412 800,428" stroke="#56636f" stroke-width="2" fill="none"/>
  <rect x="768" y="432" width="64" height="16" fill="#d8c27a" stroke="#8a5300"/>
  <text x="800" y="444" text-anchor="middle" font-size="10" fill="#142029">Nomex</text>
  <rect x="762" y="452" width="76" height="86" fill="#e3e7eb" stroke="#56636f"/>
  <text x="800" y="490" text-anchor="middle" font-size="12" fill="#56636f">av-bay or</text>
  <text x="800" y="506" text-anchor="middle" font-size="12" fill="#56636f">motor</text>
  <circle cx="840" cy="300" r="4" fill="#ffffff" stroke="#142029" stroke-width="2"/>
  <g font-size="12" fill="#142029">
    <line x1="844" y1="300" x2="862" y2="300" stroke="#8b97a2"/>
    <text x="866" y="290">vent hole,</text>
    <text x="866" y="305">1/4 in (6 mm),</text>
    <text x="866" y="320">beside the pod</text>
    <text x="866" y="350" fill="#56636f">Tube must let</text>
    <text x="866" y="365" fill="#56636f">GPS through:</text>
    <text x="866" y="380" fill="#56636f">not carbon</text>
    <text x="866" y="395" fill="#56636f">or metal</text>
  </g>
</svg>
