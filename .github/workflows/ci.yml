name: ci

on:
  push:
  pull_request:

jobs:
  software-gates:
    name: Gates 1-3 (simulation and log replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator, replay tool and tests
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests
        run: ./build/grtests
      - name: Gate 1 - guidance in a simple model
        run: ./build/grsim gate1 --runs 1000 --out reports
      - name: Gate 2 - software in the loop, with faults and accuracy regression check
        run: ./build/grsim gate2 --runs 1000 --fault-runs 100 --out reports --baseline sim/baseline.json
      - name: Stress - harsher than nominal (fails on early steering or a crash)
        run: ./build/grsim stress --runs 200 --out reports
      - name: Gate 3 - deployment detector on synthetic logs
        run: |
          ./build/grsim synth-logs --count 200 --out logs/synthetic
          ./build/grreplay --main-alt log --min-flights 100 --out reports/gate3.csv logs/synthetic/*.csv
      - name: Gate 3 - deployment detector on real flight logs
        run: |
          tools/fetch_public_logs.sh build/public-logs
          shopt -s nullglob
          ./build/grreplay --main-alt log --min-flights 50 --out reports/gate3_real.csv \
            logs/real/*.csv build/public-logs/*.csv
      - name: Gate 4 harness self-test (stand-in board over a socket)
        run: ./build/grhil --loopback --flights 20 --out reports/gate4_loopback.json
      - name: Report
        if: always()
        run: python3 tools/report.py reports reports/index.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reports
          path: reports/

  watchdog:
    name: Motor-driver watchdog (ngspice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Simulate the watchdog against its requirements
        run: hardware/watchdog/run_checks.sh --mc 40

  formal:
    name: TLA+ model check and trace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build trace recorder
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target grtrace
      - name: Model check, witnesses, mutations, trace validation
        run: ./verification/run_tla.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tla-logs
          path: build/tla/*.log

  firmware:
    name: Firmware build (ESP32-S3, Heltec V3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/targets/esp32s3/platformio.ini') }}
      - name: Build pod and ground receiver
        run: |
          pip install platformio
          cd firmware/targets/esp32s3
          pio run -e pod -e ground
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/targets/esp32s3/.pio/build/pod/firmware.bin
            firmware/targets/esp32s3/.pio/build/pod/bootloader.bin
            firmware/targets/esp32s3/.pio/build/pod/partitions.bin
            firmware/targets/esp32s3/.pio/build/ground/firmware.bin

  installer:
    name: Browser installer (GitHub Pages)
    # Publishes https://<owner>.github.io/<repo>/ from main, only after every
    # gate has passed. Pages source: "GitHub Actions" (repo Settings -> Pages).
    if: github.ref == 'refs/heads/main'
    needs: [software-gates, formal, firmware, watchdog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/targets/esp32s3/platformio.ini') }}
      - name: Build firmware and merged images
        run: |
          pip install platformio
          (cd firmware/targets/esp32s3 && pio run -e pod -e ground)
          ./tools/make_installer.sh build/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deploy
        uses: actions/deploy-pages@v4
