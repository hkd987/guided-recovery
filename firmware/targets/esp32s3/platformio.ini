; Guided Recovery OS for the S pod: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
;
;   pio run -e pod -t upload        build and flash the pod
;   pio run -e ground -t upload     build and flash a second V3 as a LoRa ground receiver
;   pio device monitor -b 115200    serial console (type "help")
;
; The board must be a V3 (or V3.1/V3.2). The V4 uses several of these GPIOs
; for its LoRa power amplifier and GNSS connector and needs its own pin map.

[platformio]
default_envs = pod

[env]
platform = platformio/espressif32@6.13.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
  symlink://../../core
  jgromes/RadioLib@^6.6.0
  olikraus/U8g2@^2.35.19

[env:pod]
build_src_filter = +<*> -<ground_main.cpp>

[env:ground]
build_src_filter = +<ground_main.cpp> +<board.h>
